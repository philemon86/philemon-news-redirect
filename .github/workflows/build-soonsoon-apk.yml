name: Build Soonsoon Bible Fully Offline APK
on:
  push:
    branches: [apk-soonsoon-offline-20261123]
    paths:
      - 'android/**'
      - '.github/workflows/build-soonsoon-apk.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Bundle complete web app and all 66 Bible books
        run: python3 android/mirror.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble installable offline APK
        run: gradle --no-daemon --stacktrace -p android assembleDebug
      - name: Check APK contents and permissions
        run: |
          set -e
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/SoonsoonBible-Offline-v1.0.apk
          test -s output/SoonsoonBible-Offline-v1.0.apk
          unzip -l output/SoonsoonBible-Offline-v1.0.apk | grep -E 'assets/web/(index.html|bible.csv|data/manifest.json|search-worker.js)' || true
          ls -lh output/*.apk
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SoonsoonBible-Offline-Android-APK
          path: output/SoonsoonBible-Offline-v1.0.apk
          retention-days: 90
          if-no-files-found: error
