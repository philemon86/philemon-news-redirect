name: Inspect Soonsoon Bible offline assets
on:
  push:
    branches: [apk-soonsoon-offline-20261123]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect main modules
        run: |
          python3 - <<'PY'
          import urllib.request, re
          from urllib.parse import urljoin
          base='https://www.philemon.com.tw/soonsoonbible/'
          paths=['app.js','search-worker.js','core.js','chinese.js','language.js','telemetry.js']
          for path in paths:
            try:
              response=urllib.request.urlopen(urllib.request.Request(urljoin(base,path),headers={'User-Agent':'Mozilla/5.0'}),timeout=30)
              s=response.read().decode('utf-8','replace')
              print('\\nFILE',path,len(s))
              print('IMPORTS',re.findall(r"from ['\"]([^'\"]+)",s))
              for term in ['fetch(', 'import(', '.json', '.csv', 'https://','http://','/api/','/data/','new URL(','Worker(','localStorage','indexDB','indexedDB']:
                pos=[m.start() for m in re.finditer(re.escape(term),s)]
                print('MATCH',term,len(pos),*[s[max(0,p-130):p+210].replace('\\n',' ') for p in pos[:16]],sep='\\n    ')
              if path in ['search-worker.js','telemetry.js']:print('FULL',s[:18000])
            except Exception as e: print('ERROR',path,str(e))
          PY
