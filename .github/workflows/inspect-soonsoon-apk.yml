name: Inspect Soonsoon Bible offline assets
on:
  push:
    branches: [apk-soonsoon-offline-20261123]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect site assets and runtime data references
        run: |
          python3 - <<'PY'
          import urllib.request, re, html
          from html.parser import HTMLParser
          url='https://www.philemon.com.tw/soonsoonbible/'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          try:
            content=urllib.request.urlopen(req,timeout=30).read()
            page=content.decode('utf-8','replace')
            print('HTTP_OK bytes=',len(content),'URL=',url)
            print('HTML_START',page[:1600],'HTML_END')
            for label, regex in [('SCRIPTS',r'<script[^>]+src=["\x27]([^"\x27]+)'),('LINKS',r'<link[^>]+href=["\x27]([^"\x27]+)'),('INLINE_FETCH',r'fetch\\s*\\((.{0,130})'),('SRC',r'<(?:img|audio|iframe)[^>]+src=["\x27]([^"\x27]+)')]:
              found=re.findall(regex,page,re.I)
              print(label,len(found),found[:35])
          except Exception as e: print('FETCH_ERROR',type(e).__name__,str(e))
          PY
