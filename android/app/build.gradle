plugins {
    id 'com.android.application'
}

android {
    namespace 'tw.com.philemon.soonsoonbible'
    compileSdk 35

    defaultConfig {
        applicationId 'tw.com.philemon.soonsoonbible'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1-offline'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.13.0'
}
