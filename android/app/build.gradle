plugins {
    id 'com.android.application'
}

android {
    namespace 'tw.com.philemon.soonsoonbible'
    compileSdk 35

    defaultConfig {
        applicationId 'tw.com.philemon.soonsoonbible'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0-offline'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
